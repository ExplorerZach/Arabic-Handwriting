    :root {
      --bg: #faf6ec;
      --bg-card: rgba(255, 253, 247, 0.92);
      --text: #2e1404;
      --text-muted: #7a5220;
      --text-soft: #5a3a12;
      --accent: #7d3f0f;
      --accent-warm: #6b3408;
      --border: rgba(150, 105, 45, 0.45);
      --border-strong: rgba(150, 105, 45, 0.7);
      --shadow: rgba(90, 55, 10, 0.15);
      --shadow-deep: rgba(110, 60, 15, 0.35);
      --btn-bg: linear-gradient(135deg, #7d3f0f, #a8601f);
      --btn-text: #fff8ee;
      --link: #7d3f0f;
      --gradient-start: #faf6ec;
      --gradient-end: #efe5cc;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a0e05;
        --bg-card: rgba(35, 18, 5, 0.8);
        --text: #f5e0b0;
        --text-muted: #cfa06a;
        --text-soft: #d4a870;
        --accent: #c0703a;
        --accent-warm: #a0602a;
        --border: rgba(192, 112, 58, 0.45);
        --border-strong: rgba(192, 112, 58, 0.6);
        --shadow: rgba(0, 0, 0, 0.4);
        --shadow-deep: rgba(0, 0, 0, 0.5);
        --btn-bg: linear-gradient(135deg, #7a3a0e, #c0703a);
        --btn-text: #fff8ee;
        --link: #d4905a;
        --gradient-start: #1a0e05;
        --gradient-end: #231008;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, serif;
      background: linear-gradient(160deg, var(--gradient-start), var(--gradient-end));
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--bg-card);
      border-radius: 20px;
      border: 1.5px solid var(--border);
      padding: 40px 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 32px var(--shadow);
    }
    .arabic {
      font-size: 42px;
      font-family: 'Amiri', 'Scheherazade', serif;
      color: var(--accent-warm);
      margin-bottom: 4px;
    }
    h1 {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .btn {
      padding: 14px 20px;
      border-radius: 12px;
      border: none;
      font-family: Georgia, serif;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: opacity 0.12s, transform 0.1s, box-shadow 0.12s;
    }
    .btn:hover {
      box-shadow: 0 4px 18px var(--shadow-deep);
      filter: brightness(1.08);
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn-primary {
      background: var(--btn-bg);
      color: var(--btn-text);
    }
    .btn-outline {
      background: transparent;
      color: var(--accent);
      border: 1.5px solid var(--border);
    }
    .icon { font-size: 18px; }
    .web-link {
      display: block;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .web-link a {
      color: var(--link);
    }
    .footer {
      margin-top: 20px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .footer a {
      color: var(--link);
    }
  </style>
</head>
