<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Arabic Script" />
    <meta name="theme-color" content="#7a3a0e" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Arabic Script Practice</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: #fdf0d0; }
    </style>
    <script type="module" crossorigin src="/assets/index-esmPRUCA.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
    <script>
  // Log whether the bundle loaded
  window.addEventListener('load', () => {
    setTimeout(() => {
      const root = document.getElementById('root');
      if (root && root.innerHTML.trim() === '') {
        console.error('⚠️ React failed to render. The #root div is empty.');
        
        // Show a visible error message on screen
        root.innerHTML = `
          <div style="padding: 40px; font-family: sans-serif; color: #7a3a0e; text-align: center;">
            <h1>Something went wrong</h1>
            <p>The app failed to load. Check the browser console for errors.</p>
          </div>
        `;
      } else {
        console.log('✅ React rendered successfully.');
      }
    }, 3000); // Wait 3 seconds for React to mount
  });
</script>
  </body>
</html>
